name: AgentWeb cross-platform redundant gateway mesh

on:
  release:
    types: [published, edited]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Public release channel to install
        required: true
        default: prod
        type: choice
        options: [main, prod]

permissions:
  actions: read
  contents: read

concurrency:
  group: awrelease-cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel || 'prod' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ephemeral path router
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy
      - name: Start two independent central RGWs
        run: >-
          python3 scripts/cross_platform_mesh.py central-start
          --channel "$CHANNEL"
          --state "$RUNNER_TEMP/mesh-coordinator"
      - name: Publish central RGW endpoints
        uses: actions/upload-artifact@v7
        with:
          name: mesh-endpoints-${{ github.run_id }}
          path: ${{ runner.temp }}/mesh-coordinator/endpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Keep central RGWs alive until every native host passes
        run: >-
          python3 scripts/github_artifact_bus.py wait-count
          --prefix "mesh-result-${{ github.run_id }}-"
          --count 4
          --timeout 1200
      - name: Stop one central RGW, route through the survivor, and recover it
        run: >-
          python3 scripts/cross_platform_mesh.py gateway-failover-test
          --state "$RUNNER_TEMP/mesh-coordinator"
          --endpoints "$RUNNER_TEMP/mesh-coordinator/endpoint.json"
          --output "$RUNNER_TEMP/mesh-failover/result.json"
      - name: Publish failover result
        uses: actions/upload-artifact@v7
        with:
          name: mesh-failover-${{ github.run_id }}
          path: ${{ runner.temp }}/mesh-failover/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload coordinator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-gateway-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/mesh-coordinator/**/*.log
          if-no-files-found: warn
          retention-days: 14

  native-install-and-mesh:
    name: native host RGW plus Mabc (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for both central RGWs
        shell: bash
        run: >-
          python scripts/github_artifact_bus.py wait-download
          --name "mesh-endpoints-${{ github.run_id }}"
          --out "${{ runner.temp }}/mesh-endpoints"
          --timeout 900
      - name: Start a distinct host-local RGW process
        shell: bash
        run: >-
          python scripts/cross_platform_mesh.py edge-start
          --endpoints "${{ runner.temp }}/mesh-endpoints/endpoint.json"
          --state "${{ runner.temp }}/host-rgw"
          --platform "${{ matrix.platform }}"
      - name: Install POSIX Mabc through the host-local RGW
        if: runner.os != 'Windows'
        shell: bash
        run: |
          gateway="$(python3 -c 'import json; print(json.load(open("${{ runner.temp }}/host-rgw/edge.json"))["localGateway"])')"
          AGENTWEB_HOME="${{ runner.temp }}/agentweb" \
            sh install.sh \
              --gateway "$gateway" \
              --device "gha-${{ matrix.platform }}-${{ github.run_id }}" \
              --profile production \
              --basic agentwebadmin
      - name: Install Windows Mabc through the host-local RGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = Get-Content -Raw "${{ runner.temp }}/host-rgw/edge.json" | ConvertFrom-Json
          & ./install.ps1 `
            -Gateway $edge.localGateway `
            -DeviceName "gha-${{ matrix.platform }}-${{ github.run_id }}" `
            -Profile production `
            -Basic agentwebadmin `
            -AgentWebHome "${{ runner.temp }}/agentweb"
      - name: Exercise local and both central routing paths
        shell: bash
        run: >-
          python scripts/cross_platform_mesh.py client-test
          --endpoints "${{ runner.temp }}/mesh-endpoints/endpoint.json"
          --edge-state "${{ runner.temp }}/host-rgw"
          --platform "${{ matrix.platform }}"
          --output "${{ runner.temp }}/mesh-result/result.json"
      - name: Publish native host result
        uses: actions/upload-artifact@v7
        with:
          name: mesh-result-${{ github.run_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/mesh-result/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep the host RGW and Mabc alive through failover recovery
        shell: bash
        run: >-
          python scripts/github_artifact_bus.py wait-download
          --name "mesh-failover-${{ github.run_id }}"
          --out "${{ runner.temp }}/mesh-failover-proof"
          --timeout 900
      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-host-diagnostics-${{ github.run_id }}-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/host-rgw/*.log
            ${{ runner.temp }}/agentweb/logs/**
          if-no-files-found: warn
          retention-days: 14
