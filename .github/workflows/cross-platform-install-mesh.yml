name: AgentWeb cross-platform redundant gateway mesh

on:
  release:
    types: [published, edited]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Public release channel to install
        required: true
        default: prod
        type: choice
        options: [main, prod]

permissions:
  actions: read
  contents: read

concurrency:
  group: awrelease-cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-install-and-mesh:
    name: native install and redundant mesh (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CHANNEL: ${{ inputs.channel || 'prod' }}
      MESH_STATE: ${{ runner.temp }}/mesh-gateway
      MESH_ENDPOINTS: ${{ runner.temp }}/mesh-endpoints
    steps:
      - uses: actions/checkout@v7
      - name: Start this platform's ephemeral gateway
        shell: bash
        run: >-
          python scripts/cross_platform_mesh.py gateway-start
          --channel "$CHANNEL"
          --platform "${{ matrix.platform }}"
          --state "$MESH_STATE"
      - name: Publish this platform's gateway endpoint
        uses: actions/upload-artifact@v7
        with:
          name: mesh-gateway-${{ github.run_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/mesh-gateway/endpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Download all four gateway endpoints
        shell: bash
        run: |
          for platform in linux-x64 linux-arm64 macos-arm64 windows-x64; do
            python scripts/github_artifact_bus.py wait-download \
              --name "mesh-gateway-${{ github.run_id }}-${platform}" \
              --out "$MESH_ENDPOINTS/${platform}" \
              --timeout 900
          done
      - name: Join this all-in-one gateway to the redundant set
        shell: bash
        run: >-
          python scripts/cross_platform_mesh.py gateway-configure
          --state "$MESH_STATE"
          --endpoints "$MESH_ENDPOINTS"
      - name: Publish gateway readiness
        uses: actions/upload-artifact@v7
        with:
          name: mesh-ready-${{ github.run_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/mesh-gateway/endpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for all redundant gateways
        shell: bash
        run: >-
          python scripts/github_artifact_bus.py wait-count
          --prefix "mesh-ready-${{ github.run_id }}-"
          --count 4
          --timeout 900
      - name: Install POSIX Mabc from this public gateway
        if: runner.os != 'Windows'
        shell: bash
        run: |
          gateway="$(python3 -c 'import json; print(json.load(open("${{ runner.temp }}/mesh-gateway/endpoint.json"))["url"])')"
          AGENTWEB_HOME="${{ runner.temp }}/agentweb" \
            sh install.sh \
              --gateway "$gateway" \
              --device "gha-${{ matrix.platform }}-${{ github.run_id }}" \
              --profile production \
              --basic agentwebadmin
      - name: Install Windows Mabc from this public gateway
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gateway = (Get-Content -Raw "${{ runner.temp }}/mesh-gateway/endpoint.json" | ConvertFrom-Json).url
          & ./install.ps1 `
            -Gateway $gateway `
            -DeviceName "gha-${{ matrix.platform }}-${{ github.run_id }}" `
            -Profile production `
            -Basic agentwebadmin `
            -AgentWebHome "${{ runner.temp }}/agentweb"
      - name: Exercise every platform through every gateway
        shell: bash
        run: >-
          python scripts/cross_platform_mesh.py client-test
          --endpoints "$MESH_ENDPOINTS"
          --platform "${{ matrix.platform }}"
          --output "${{ runner.temp }}/mesh-result/result.json"
      - name: Publish native client result
        uses: actions/upload-artifact@v7
        with:
          name: mesh-result-${{ github.run_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/mesh-result/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep every platform alive through baseline completion
        shell: bash
        run: >-
          python scripts/github_artifact_bus.py wait-count
          --prefix "mesh-result-${{ github.run_id }}-"
          --count 4
          --timeout 1200
      - name: Stop one gateway, route through a survivor, and recover it
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: >-
          python scripts/cross_platform_mesh.py gateway-failover-test
          --state "$MESH_STATE"
          --endpoints "$MESH_ENDPOINTS"
          --output "${{ runner.temp }}/mesh-failover/result.json"
      - name: Publish failover result
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: mesh-failover-${{ github.run_id }}
          path: ${{ runner.temp }}/mesh-failover/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep every gateway alive through failover recovery
        shell: bash
        run: >-
          python scripts/github_artifact_bus.py wait-download
          --name "mesh-failover-${{ github.run_id }}"
          --out "${{ runner.temp }}/mesh-failover-proof"
          --timeout 900
      - name: Upload gateway diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-gateway-diagnostics-${{ github.run_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/mesh-gateway/*.log
          if-no-files-found: warn
          retention-days: 14
